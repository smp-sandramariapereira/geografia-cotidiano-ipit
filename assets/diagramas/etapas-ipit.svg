<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 210" role="img" aria-labelledby="t d"><title id="t">IPIT: dez aulas distribuídas em oito etapas</title><desc id="d">Duas aulas de Descoberta; uma de Ideação, Solução, Tecnologia, MVP e Arquitetura; duas de Desenvolvimento; uma de Pitch. Dez aulas de 50 minutos, total 500.</desc><rect width="1160" height="210" rx="12" fill="#F2F6F9"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="10" y="10" width="277" height="90" rx="12" fill="#163653"/><text x="148" y="34" font-size="17" font-weight="bold" fill="#fff">Aulas 1–2</text><text x="148" y="59" font-size="19" fill="#fff">Descoberta</text><text x="148" y="83" font-size="15" fill="#F3E4B5">100 min</text><rect x="298" y="10" width="277" height="90" rx="12" fill="#0B7F86"/><text x="436" y="34" font-size="17" font-weight="bold" fill="#fff">Aula 3</text><text x="436" y="59" font-size="19" fill="#fff">Ideação</text><text x="436" y="83" font-size="15" fill="#F3E4B5">50 min</text><rect x="586" y="10" width="277" height="90" rx="12" fill="#176A52"/><text x="724" y="34" font-size="17" font-weight="bold" fill="#fff">Aula 4</text><text x="724" y="59" font-size="19" fill="#fff">Solução</text><text x="724" y="83" font-size="15" fill="#F3E4B5">50 min</text><rect x="874" y="10" width="277" height="90" rx="12" fill="#163653"/><text x="1012" y="34" font-size="17" font-weight="bold" fill="#fff">Aula 5</text><text x="1012" y="59" font-size="19" fill="#fff">Tecnologia</text><text x="1012" y="83" font-size="15" fill="#F3E4B5">50 min</text><rect x="10" y="110" width="277" height="90" rx="12" fill="#0B7F86"/><text x="148" y="134" font-size="17" font-weight="bold" fill="#fff">Aula 6</text><text x="148" y="159" font-size="19" fill="#fff">MVP</text><text x="148" y="183" font-size="15" fill="#F3E4B5">50 min</text><rect x="298" y="110" width="277" height="90" rx="12" fill="#176A52"/><text x="436" y="134" font-size="17" font-weight="bold" fill="#fff">Aula 7</text><text x="436" y="159" font-size="19" fill="#fff">Arquitetura</text><text x="436" y="183" font-size="15" fill="#F3E4B5">50 min</text><rect x="586" y="110" width="277" height="90" rx="12" fill="#163653"/><text x="724" y="134" font-size="17" font-weight="bold" fill="#fff">Aulas 8–9</text><text x="724" y="159" font-size="19" fill="#fff">Desenvolvimento</text><text x="724" y="183" font-size="15" fill="#F3E4B5">100 min</text><rect x="874" y="110" width="277" height="90" rx="12" fill="#0B7F86"/><text x="1012" y="134" font-size="17" font-weight="bold" fill="#fff">Aula 10</text><text x="1012" y="159" font-size="19" fill="#fff">Pitch</text><text x="1012" y="183" font-size="15" fill="#F3E4B5">50 min</text></g></svg>