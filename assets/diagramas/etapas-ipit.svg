<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 115" role="img" aria-labelledby="t d"><title id="t">Oito etapas IPIT em três aulas</title><desc id="d">Aula um: descoberta e ideação; aula dois: solução, tecnologia, MVP e arquitetura; aula três: desenvolvimento e pitch.</desc><rect width="1100" height="115" rx="13" fill="#f2f6f9"/><g font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle"><rect x="12" y="10" width="255" height="94" rx="12" fill="#163653"/><text x="139" y="37" fill="white">AULA 1 · 50 min</text><text x="139" y="63" fill="white">Descoberta → Ideação</text><text x="139" y="85" font-size="13" fill="#e2d6a8">30 + 20 min</text><rect x="279" y="10" width="520" height="94" rx="12" fill="#0b7f86"/><text x="539" y="37" fill="white">AULA 2 · 50 min</text><text x="539" y="63" fill="white">Solução → Tecnologia → MVP → Arquitetura</text><text x="539" y="85" font-size="13" fill="#ecf7f7">10 + 10 + 10 + 20 min</text><rect x="811" y="10" width="277" height="94" rx="12" fill="#176a52"/><text x="949" y="37" fill="white">AULA 3 · 50 min</text><text x="949" y="63" fill="white">Desenvolvimento → Pitch</text><text x="949" y="85" font-size="13" fill="#e0f4e4">25 + 25 min</text></g></svg>